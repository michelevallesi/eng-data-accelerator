spring:
  application:
    name: eda-resolver
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eda}
    username: ${DB_USER:eda}
    password: ${DB_PASS:dev}
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

eda:
  base-domain: ${EDA_BASE_DOMAIN:https://eda.example.org}
  event-source: ${EDA_EVENT_SOURCE:urn:eda:resolver}
  fixtures:
    seed: ${EDA_FIXTURES_SEED:}
