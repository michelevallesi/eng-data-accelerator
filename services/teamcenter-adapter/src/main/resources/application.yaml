spring:
  application:
    name: eda-teamcenter-adapter
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eda}
    username: ${DB_USER:eda}
    password: ${DB_PASS:dev}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.cloudevents.kafka.CloudEventSerializer
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,readiness
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

eda:
  base-domain: ${EDA_BASE_DOMAIN:https://eda.example.org}
  mapping-version: "1"
  teamcenter:
    base-url: ${EDA_TEAMCENTER_BASE_URL:http://localhost:8083}
    poll-interval-ms: ${EDA_TEAMCENTER_POLL_MS:2000}
    outbox-relay-interval-ms: ${EDA_TEAMCENTER_OUTBOX_RELAY_MS:1000}
    outbox-relay-batch-size: ${EDA_TEAMCENTER_OUTBOX_BATCH:100}
    source-id: urn:eda:adapter:teamcenter
  kafka:
    topics:
      changes: eda.teamcenter.changes
      dlq: eda.teamcenter.dlq
